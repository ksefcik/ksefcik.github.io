site_name: Testovací dokumentace
site_description: Testovací dokumentace na GitHub Pages
site_url: https://ksefcik.github.io/

repo_name: ksefcik/ksefcik.github.io
repo_url: https://github.com/ksefcik/ksefcik.github.io
edit_uri: edit/main/docs/

theme:
  name: material
  language: cs

  icon:
    repo: fontawesome/brands/github

  palette:
    scheme: slate
    primary: black
    accent: green

  features:
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.action.edit

plugins:
  - search:
      lang: cs

nav:
  - Úvod: index.md
  - Začínáme:
      - Instalace: instalace.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - toc:
      permalink: true
      toc_depth: 3

extra_css:
  - stylesheets/extra.css

copyright: Copyright &copy; 2026 Testovací dokumentace
