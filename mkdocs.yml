site_name: ICT Dokumentace
site_description: Centrální technická dokumentace ICT
site_author: ICT

site_url: https://ksefcik.github.io/

theme:
  name: material
  language: cs

  logo: material/book-open-page-variant

  palette:
    scheme: slate
    primary: custom
    accent: custom

  font:
    text: Roboto
    code: Roboto Mono

  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.sections
    - navigation.path
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.tooltips

plugins:
  - search:
      lang: cs

nav:
  - Přehled: index.md
  - Začínáme:
      - Instalace: instalace.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences

  - pymdownx.highlight:
      anchor_linenums: true

  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

  - toc:
      permalink: true
      toc_depth: 3

extra_css:
  - stylesheets/extra.css

extra:
  generator: false

  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ksefcik/ksefcik.github.io
      name: Zdrojový repozitář

copyright: ICT Dokumentace
